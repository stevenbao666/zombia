    for (let k = 0; k < STAGES_PER_CH; k++) {
      const idx = ch * STAGES_PER_CH + k, locked = idx > s.maxStage, stars = s.stars[idx] || 0, boss = k === STAGES_PER_CH - 1;
      const cls = ['node', boss ? 'boss' : '', stars ? 'cleared' : '', idx === s.sel ? 'sel' : '', locked ? 'locked' : ''].join(' ');
      const inner = locked ? icon('lock') : boss ? icon('skull') : `${ch + 1}-${k + 1}`;
      html += `<div class="${cls}"><button data-idx="${idx}" ${locked ? 'disabled' : ''} aria-label="关卡 ${ch + 1}-${k + 1}">${inner}</button><div class="stars">${[0, 1, 2].map(i => STAR_SVG(i < stars)).join('')}</div></div>`;
    }
    $('stageNodes').innerHTML = html;
    $('stageNodes').querySelectorAll('button[data-idx]').forEach(b => b.onclick = () => { s.sel = +b.dataset.idx; Save.save(); this.renderBattle(); Game.makeDemo(); });
    const unlockW = WEAPON_IDS.find(id => WEAPONS[id].unlock === ch + 1);
    const cleared = (s.stars[ch * STAGES_PER_CH + 4] || 0) > 0;
    const TH = THEMES[ch];
    $('chTip').innerHTML = (unlockW ? (cleared ? `已解锁武器：<b>${WEAPONS[unlockW].name}</b>` : `击败 Boss「${C.boss.name}」解锁武器：<b>${WEAPONS[unlockW].name}</b>`) : `Boss：${C.boss.name}`)
      + `<div class="hz-tip" style="--hz:${HZ_COL[TH.hazard]}"><span>天灾 · ${TH.hzName}</span>${TH.hzDesc}</div>`;
    const sc = Math.floor(s.sel / STAGES_PER_CH), ss = s.sel % STAGES_PER_CH;
    $('startLabel').textContent = `${sc + 1}-${ss + 1}`;
  },

  // ---------- research ----------
  renderResearch() {
    const s = Save.d;
    $('researchList').innerHTML = RESEARCH.map(r => {
      const lv = s.research[r.id], max = lv >= r.max, cost = researchCost(r, lv);
      return `<div class="row"><div class="ico">${icon(r.icon)}</div>
        <div><div class="t">${r.name}<span class="lv">LV ${lv}/${r.max}</span></div>
        <div class="d">${r.eff(lv)}${max ? '' : ` → <em>${r.eff(lv + 1)}</em>`}</div></div>
        ${max ? '<span class="buy done">已满级</span>' : `<button class="buy" data-r="${r.id}" ${s.gold < cost ? 'disabled' : ''}>${icon('gold')}${fmt(cost)}</button>`}</div>`;
    }).join('');
    $('researchList').querySelectorAll('button[data-r]').forEach(b => b.onclick = () => {
      const r = RESEARCH.find(x => x.id === b.dataset.r), lv = s.research[r.id], cost = researchCost(r, lv);
      if (s.gold < cost || lv >= r.max) return;
      s.gold -= cost; s.research[r.id]++; Save.save(); SFX.pickup(); this.res(); this.renderResearch();
    });
  },

  // ---------- weapons ----------
  renderWeapons() {
    const s = Save.d, unl = unlockedWeapons();
    let html = `<div class="callout">${icon('kit', 'ic')}<div class="grow"><div class="t">军需补给箱</div><div class="d">随机图纸 + 金币，每天可免费开一次</div></div>
      ${s.daily.free ? `<button class="buy" id="chestPaid" ${s.gems < 60 ? 'disabled' : ''}>${icon('gem')}60</button>` : `<button class="buy claim" id="chestFree">免费</button>`}</div>`;
    html += '<div class="section-label">特殊武器</div><div class="wgrid">';
    for (const id of WEAPON_IDS) {
      const Wd = WEAPONS[id], locked = !unl.includes(id), star = s.wstar[id], max = star >= WSTAR_MAX, cost = wstarCost(star), have = s.bp[id] || 0;
      const can = !locked && !max && have >= cost.bp && s.gold >= cost.gold;
      html += `<div class="wcard ${locked ? 'locked' : ''}">
        <div class="top">${icon(locked ? 'lock' : id)}<div><div class="nm">${Wd.name}</div><div class="starline">★ ${star}/${WSTAR_MAX}</div></div></div>
        <div class="meta">进化：<b>${Wd.evo}</b><br>需要满级 + ${PASSIVES[Wd.pair].name}<br>伤害加成 <b>+${15 * (star - 1)}%</b></div>
        ${locked ? `<div class="meta">通关第 ${Wd.unlock} 章解锁</div>` : max ? '<span class="buy done">已满星</span>' : `
        <div class="bpline">${icon('bp')}<div class="bar"><i style="width:${Math.min(100, have / cost.bp * 100)}%"></i></div>${have}/${cost.bp}</div>
        <button class="buy" data-w="${id}" ${can ? '' : 'disabled'}>${icon('gold')}${fmt(cost.gold)} 升星</button>`}
      </div>`;
    }
    html += '</div>';
    $('weaponsBody').innerHTML = html;
    const free = $('chestFree'), paid = $('chestPaid');
    if (free) free.onclick = () => this.openChest(false);
    if (paid) paid.onclick = () => this.openChest(true);
    $('weaponsBody').querySelectorAll('button[data-w]').forEach(b => b.onclick = () => {
      const id = b.dataset.w, star = s.wstar[id], cost = wstarCost(star);
      if (star >= WSTAR_MAX || s.bp[id] < cost.bp || s.gold < cost.gold) return;
      s.bp[id] -= cost.bp; s.gold -= cost.gold; s.wstar[id]++; Save.save(); SFX.level(); this.res(); this.renderWeapons();
      this.toast(`${WEAPONS[id].name} 升到 ★${s.wstar[id]}`);
    });
  },
  openChest(paid) {
    const s = Save.d;
    if (paid) { if (s.gems < 60) return; s.gems -= 60; } else { if (s.daily.free) return; s.daily.free = true; }
    const gold = paid ? 300 + Math.floor(Math.random() * 500) : 150 + Math.floor(Math.random() * 150);
    const bp = addBlueprints({}, paid ? 8 : 4, Math.random);
    s.gold += gold; for (const k in bp) s.bp[k] += bp[k];
    Save.save(); SFX.crate(); this.res(); this.renderWeapons(); this.badge();
    this.modal(`<div class="mcard win"><h3>补给到货</h3><div class="rewards"><span class="res">${icon('gold')}${fmt(gold)}</span>${Object.entries(bp).map(([k, v]) => `<span class="res">${icon(k)}图纸 ×${v}</span>`).join('')}</div>
      <div class="actions"><button class="btn-primary" data-close>收下</button></div></div>`);
  },

  // ---------- talents ----------
  renderTalents() {
    const s = Save.d;
    $('talentList').innerHTML = TALENTS.map(t => {
      const lv = s.talents[t.id], max = lv >= t.max, cost = t.cost[lv];
      return `<div class="row"><div class="ico round">${icon(t.icon)}</div>
        <div><div class="t">${t.name}<span class="lv">${lv}/${t.max}</span></div><div class="d">${max ? t.desc(lv) : (lv ? t.desc(lv) + ' → <em>' + t.desc(lv + 1) + '</em>' : t.desc(1))}</div></div>
        ${max ? '<span class="buy done">已解锁</span>' : `<button class="buy" data-t="${t.id}" ${s.gems < cost ? 'disabled' : ''}>${icon('gem')}${cost}</button>`}</div>`;
    }).join('');
    $('talentList').querySelectorAll('button[data-t]').forEach(b => b.onclick = () => {
      const t = TALENTS.find(x => x.id === b.dataset.t), lv = s.talents[t.id], cost = t.cost[lv];
      if (lv >= t.max || s.gems < cost) return;
      s.gems -= cost; s.talents[t.id]++; Save.save(); SFX.level(); this.res(); this.renderTalents();
    });
  },

  // ---------- tasks ----------
  renderTasks() {
    const s = Save.d; ensureDaily();
    document.querySelectorAll('#taskSeg button').forEach(b => b.classList.toggle('on', b.dataset.seg === this.taskSeg));
    let html = '';
    if (this.taskSeg === 'daily') {
      html += `<div class="callout">${icon('gold')}<div class="grow"><div class="t">每日报到</div><div class="d">金币 150 · 钻石 5</div></div>
        ${s.daily.login ? '<span class="buy done">已领取</span>' : '<button class="buy claim" data-claim="login">领取</button>'}</div>`;
      for (const t of s.daily.tasks) {
        const def = DAILY_POOL.find(x => x.id === t.id); if (!def) continue;
        const done = t.prog >= def.goal;
        html += `<div class="row"><div class="ico">${icon(def.reward.gold ? 'gold' : 'gem')}</div>
          <div><div class="t">${def.name}</div><div class="d">奖励 ${def.reward.gold ? def.reward.gold + ' 金币' : def.reward.gems + ' 钻石'}</div>
          <div class="bar mini"><i style="width:${Math.min(100, t.prog / def.goal * 100)}%"></i></div></div>
          ${t.claimed ? '<span class="buy done">已领取</span>' : done ? `<button class="buy claim" data-claim="d:${t.id}">领取</button>` : `<span class="buy done num">${fmt(t.prog)}/${fmt(def.goal)}</span>`}</div>`;
      }
      const all = s.daily.tasks.length && s.daily.tasks.every(t => t.claimed);
      html += `<div class="callout" style="margin-top:12px">${icon('kit')}<div class="grow"><div class="t">全勤宝箱</div><div class="d">完成并领取全部每日任务：钻石 30 + 图纸 6</div></div>
        ${s.daily.chest ? '<span class="buy done">已领取</span>' : `<button class="buy claim" data-claim="chest" ${all ? '' : 'disabled'}>开启</button>`}</div>`;
    } else {
      const list = ACHIEVEMENTS.slice().sort((a, b) => (!!s.ach[a.id]) - (!!s.ach[b.id]));
      for (const a of list) {
        const v = statValue(a.stat), done = v >= a.goal, claimed = !!s.ach[a.id];
        html += `<div class="row"><div class="ico round">${icon(done ? 'vet' : 'lock')}</div>
          <div><div class="t">${a.name}</div><div class="d">${a.desc} · 奖励 ${a.gems} 钻石</div><div class="bar mini"><i style="width:${Math.min(100, v / a.goal * 100)}%"></i></div></div>
          ${claimed ? '<span class="buy done">已领取</span>' : done ? `<button class="buy claim" data-claim="a:${a.id}">领取</button>` : `<span class="buy done num">${fmt(Math.min(v, a.goal))}/${fmt(a.goal)}</span>`}</div>`;
      }
    }
    $('tasksBody').innerHTML = html;
    $('tasksBody').querySelectorAll('button[data-claim]').forEach(b => b.onclick = () => this.claim(b.dataset.claim));
  },
  claim(key) {
    const s = Save.d; let msg = '';
    if (key === 'login') { if (s.daily.login) return; s.daily.login = true; s.gold += 150; s.gems += 5; msg = '金币 +150，钻石 +5'; }
    else if (key === 'chest') { if (s.daily.chest || !s.daily.tasks.every(t => t.claimed)) return; s.daily.chest = true; s.gems += 30; const bp = addBlueprints({}, 6, Math.random); for (const k in bp) s.bp[k] += bp[k]; msg = '钻石 +30，图纸 +6'; }
    else if (key.startsWith('d:')) { const t = s.daily.tasks.find(x => x.id === key.slice(2)), def = DAILY_POOL.find(x => x.id === key.slice(2)); if (!t || t.claimed || t.prog < def.goal) return; t.claimed = true; if (def.reward.gold) { s.gold += def.reward.gold; msg = '金币 +' + def.reward.gold; } else { s.gems += def.reward.gems; msg = '钻石 +' + def.reward.gems; } }
    else if (key.startsWith('a:')) { const a = ACHIEVEMENTS.find(x => x.id === key.slice(2)); if (!a || s.ach[a.id] || statValue(a.stat) < a.goal) return; s.ach[a.id] = true; s.gems += a.gems; msg = `成就「${a.name}」钻石 +${a.gems}`; }
    Save.save(); SFX.coin(); this.res(); this.renderTasks(); this.badge(); this.toast(msg);
  },

  // ---------- in-run ----------
  enterRun(run) {
    $('home').hidden = true; $('hud').hidden = false; this.closeModal();
    $('hudChapter').textContent = run.chapter.name; $('hudStage').textContent = `${run.ch + 1}-${run.st + 1}`;
    this.hudCache = {}; this.loadout(run);
  },
  enterHome() { $('hud').hidden = true; $('home').hidden = false; this.closeModal(); this.res(); this.renderBattle(); this.badge(); if (this.tab !== 'battle') this.showTab(this.tab); },
  hud(run) {
    const c = this.hudCache;
    const g = fmt(run.gold); if (c.g !== g) { c.g = g; $('hudGold').textContent = g; }
    const k = fmt(run.kills); if (c.k !== k) { c.k = k; $('hudKills').textContent = k; }
    const boss = run.boss && !run.boss.dead;
    const pv = boss ? Math.max(0, run.boss.hp / run.boss.maxHp) : run.p;
    const pw = (pv * 100).toFixed(1); if (c.p !== pw) { c.p = pw; $('hudProg').style.width = pw + '%'; }
    if (c.boss !== boss) { c.boss = boss; $('hudBar').classList.toggle('boss', boss); $('hudChapter').textContent = boss ? run.boss.B.name : run.chapter.name; }
    const ew = (run.energy / run.need * 100).toFixed(0); if (c.e !== ew) { c.e = ew; $('hudEnergy').style.width = ew + '%'; }
    if (c.lv !== run.lvl) { c.lv = run.lvl; $('hudLv').textContent = 'Lv' + run.lvl; }
  },
  loadout(run) {
    let h = '';
    for (const id in run.weapons) { const w = run.weapons[id]; h += `<div class="lo ${w.evo ? 'evo' : ''}">${icon(id)}<b>${w.evo ? 'EVO' : w.lv}</b></div>`; }
    for (const id in run.passives) h += `<div class="lo pas">${icon(id)}<b>${run.passives[id]}</b></div>`;
    $('hudLoadout').innerHTML = h;
  },
  banner(b) {
    const el = $('banner');
    el.className = 'k-' + (b.kind || 'warn');
    $('bannerText').textContent = b.text; $('bannerSub').textContent = b.sub || '';
    el.hidden = false; void el.offsetWidth; el.classList.add('show');
    clearTimeout(this._bt); this._bt = setTimeout(() => { el.hidden = true; }, 2150);
  },
  modal(html) {
    const m = $('modal'); m.innerHTML = html; m.hidden = false;
    m.querySelectorAll('[data-close]').forEach(b => b.onclick = () => this.closeModal());
  },
  closeModal() { $('modal').hidden = true; $('modal').innerHTML = ''; },
  choices(run) {
    const cs = run.makeChoices(run.meta.choices);
    const card = (c, i) => { const f = run.choiceInfo(c); return `<button class="choice k-${f.kind}" data-i="${i}"><div class="ico">${icon(f.icon)}</div><div><div class="nm">${esc(f.name)}<span class="tag">${esc(f.tag)}</span></div><div class="ds">${esc(f.desc)}</div>${f.note ? `<div class="nt">${esc(f.note)}</div>` : ''}</div></button>`; };
    this.modal(`<div class="mcard"><h3>升级</h3><div class="msub">选择一项强化 · Lv${run.lvl}</div><div class="choices">${cs.map(card).join('')}</div>
      ${run.rerolls > 0 ? `<button class="btn reroll" id="btnReroll">${icon('reroll')}刷新选项（剩余 ${run.rerolls}）</button>` : ''}</div>`);
    $('modal').querySelectorAll('button.choice').forEach(b => b.onclick = () => {
      run.applyChoice(cs[+b.dataset.i]); this.closeModal(); this.loadout(run);
      if (run.pending > 0) { run.state = 'choose'; setTimeout(() => this.choices(run), 120); }
    });
    const rb = $('btnReroll'); if (rb) rb.onclick = () => { run.rerolls--; this.choices(run); };
  },
  pause(run) {
    this.modal(`<div class="mcard"><h3>暂停</h3><div class="msub">${run.ch + 1}-${run.st + 1} ${run.chapter.name} · 兵力 ${fmt(run.count)}</div>
      <div class="actions"><button class="btn-primary" id="btnResume">继续战斗</button>
      <div class="pair"><button class="btn" id="btnSnd">${Save.d.settings.sound ? '关闭音效' : '开启音效'}</button><button class="btn" id="btnQuit">撤退</button></div></div></div>`);
    $('btnResume').onclick = () => Game.resume();
    $('btnSnd').onclick = () => { Save.d.settings.sound = !Save.d.settings.sound; this.soundIcon(); Save.save(); $('btnSnd').textContent = Save.d.settings.sound ? '关闭音效' : '开启音效'; };
    $('btnQuit').onclick = () => {
      this.modal(`<div class="mcard lose"><h3>确定撤退？</h3><div class="msub">撤退算作失败，只带回 60% 的战场金币。</div>
        <div class="actions"><div class="pair"><button class="btn" id="btnBack">再想想</button><button class="btn" id="btnQuit2" style="color:var(--blood)">撤退</button></div></div></div>`);
      $('btnBack').onclick = () => this.pause(run);
      $('btnQuit2').onclick = () => { this.closeModal(); run.state = 'lost'; run.result = 'lost'; this.result(run, run.summary()); };
    };
  },
  revive(run) {
    this.modal(`<div class="mcard lose"><h3>防线告急</h3><div class="msub">使用「战地复活」恢复 ${fmt(Math.max(10, Math.round(run.maxCount * 0.4)))} 名士兵并清除防线附近的僵尸。</div>
      <div class="actions"><button class="btn-primary" id="btnRevive">${icon('revive')}复活</button><button class="btn" id="btnGiveUp">放弃</button></div></div>`);
    $('btnRevive').onclick = () => { this.closeModal(); run.revive(); };
    $('btnGiveUp').onclick = () => { this.closeModal(); run.state = 'play'; run.lose(); };
  },
  result(run, sum) {
    if (run !== Game.run) return;
    const rw = applyRunResult(sum);
    const idx = sum.idx, next = idx + 1 < TOTAL_STAGES && Save.d.maxStage >= idx + 1;
    const bpTotal = Object.values(rw.bp).reduce((a, b) => a + b, 0);
    const stars = [0, 1, 2].map(i => STAR_SVG(i < sum.stars)).join('');
    this.modal(`<div class="mcard ${sum.won ? 'win' : 'lose'}">
      <h3>${sum.won ? '防线守住了' : '防线失守'}</h3><div class="msub">${run.ch + 1}-${run.st + 1} ${run.chapter.name}${sum.won ? (rw.firstClear ? ' · 首次通关' : '') : ' · 带回 60% 金币'}</div>
      ${sum.won ? `<div class="result-stars">${stars}</div><div class="msub">${sum.leaked <= 3 ? '几乎没有僵尸摸到防线' : `${sum.leaked} 只僵尸摸到了防线`}</div>` : ''}
      <div class="stats"><div><b>${fmt(sum.kills)}</b><span>击杀</span></div><div><b>${fmt(sum.maxCount)}</b><span>最高兵力</span></div><div><b>${sum.evolves}</b><span>武器进化</span></div></div>
      <div class="rewards"><span class="res">${icon('gold')}+${fmt(rw.gold)}</span>${rw.gems ? `<span class="res">${icon('gem')}+${rw.gems}</span>` : ''}${bpTotal ? `<span class="res">${icon('bp')}+${bpTotal}</span>` : ''}</div>
      ${rw.newWeapons.map(id => `<div class="unlock-note">${icon(id)}<div>解锁新武器 <b>${WEAPONS[id].name}</b>，之后的战斗中会出现在军火箱和升级选项里。</div></div>`).join('')}
      ${!sum.won ? '<div class="unlock-note" style="background:#2a2f36;border-color:var(--rule)">' + icon('rate') + '<div>去「科研」强化伤害和开局兵力，或在左列多抢增兵门。</div></div>' : ''}
      <div class="actions">
        ${sum.won && next ? `<button class="btn-primary" id="btnNext">下一关 <span class="num">${Math.floor((idx + 1) / 5) + 1}-${(idx + 1) % 5 + 1}</span></button>` : `<button class="btn-primary" id="btnRetry">${sum.won ? '再打一次' : '再来一次'}</button>`}
        <div class="pair"><button class="btn" id="btnHome">返回基地</button>${sum.won && next ? '<button class="btn" id="btnRetry">再打一次</button>' : '<button class="btn" id="btnUpgrade">去强化</button>'}</div>
      </div></div>`);
    const go = i => { Save.d.sel = i; Save.save(); this.closeModal(); Game.start(i); };
    const n = $('btnNext'); if (n) n.onclick = () => go(idx + 1);
    const r = $('btnRetry'); if (r) r.onclick = () => go(idx);
    $('btnHome').onclick = () => { Game.quit(); };
    const u = $('btnUpgrade'); if (u) u.onclick = () => { Game.quit(); this.showTab('research'); };
  },
  tutorial(done) {
    this.modal(`<div class="mcard"><h3>作战简报</h3><div class="msub">左右拖动屏幕移动小队，士兵会自动向前射击</div>
      <div class="tut">
        <div class="r"><div class="sw" style="background:#1d3a4a">${icon('troops')}</div><div class="c"><b>左列 · 增援</b>：打碎冰块救出士兵；站在这一列时，门过防线就会生效。蓝色门是 + 和 ×，红色门是 − 和 ÷。朝红色门开枪能把数字打上去，÷ 门可以直接打碎。</div></div>
        <div class="r"><div class="sw" style="background:#2c3a22">${icon('skull')}</div><div class="c"><b>中列 · 尸群</b>：僵尸成排压过来，冲到黄黑防线后会堵在你面前一直啃，不打死就持续掉兵。带血条的<b>巨尸</b>要把血条打空才会倒下。兵力归零就失败。</div></div>
        <div class="r"><div class="sw" style="background:#3a2a1a">${icon('rocket')}</div><div class="c"><b>右列 · 军火</b>：打碎军火箱获得火箭筒等武器，重复获得会升级。金币桶给钱。</div></div>
        <div class="r"><div class="sw" style="background:#2a2f3a">${icon('energy')}</div><div class="c"><b>升级</b>：击杀僵尸充能，满了三选一。武器满级再拿到对应被动，就能<b>进化</b>。</div></div>
      </div>
      <div class="actions"><button class="btn-primary" id="btnTutOk">${done ? '出发' : '明白了'}</button></div></div>`);
    $('btnTutOk').onclick = () => { this.closeModal(); if (done) done(); };
  },
};

// ================= BOOT =================
function boot() {
  Save.load();
  Sound.on = Save.d.settings.sound;
  Render.init($('cv'));
  UI.init();
  requestAnimationFrame(t => Game.frame(t));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { UI.renderBattle(); }).catch(() => {});
  Save.connect();
}
boot();

</script>
</body></html>
