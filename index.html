<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>尸潮突击队</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+SC:wght@500;700;900&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* Layout: a phone-shaped stage centered on a night backdrop; the canvas road fills it and DOM HUD, base menus and dialogs layer on top. Single dark theme by design (night road). */
:root {
  --night: #111418;
  --asphalt: #22282f;
  --panel: #252c34;
  --panel-hi: #303943;
  --rule: #3b4550;
  --hazard: #f2b632;
  --hazard-deep: #b98613;
  --ink: #1d1604;
  --ice: #7fd8ff;
  --toxic: #9fc85a;
  --blood: #e2483f;
  --gate: #3d8bff;
  --text: #eef1f3;
  --muted: #9aa6b2;
  --f-display: "ZCOOL QingKe HuangYou", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-num: "Bungee", "Noto Sans SC", system-ui, sans-serif;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; background: var(--night); }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--night); color: var(--text); font-family: var(--f-body); font-size: 14px; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible { outline: 2px solid var(--hazard); outline-offset: 2px; }
img.ic { width: 20px; height: 20px; display: block; flex: none; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden;
  background: repeating-linear-gradient(135deg, #14181d 0 14px, #111418 14px 28px); }
#stage { position: absolute; overflow: hidden; background: var(--asphalt); box-shadow: 0 0 0 1px #000, 0 20px 60px rgba(0,0,0,.6); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: .02em; }

/* ---------- shared bits ---------- */
.res { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 6px; border-radius: 15px; background: rgba(17,20,24,.82); border: 1px solid var(--rule); font-family: var(--f-num); font-size: 13px; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: rgba(17,20,24,.82); border: 1px solid var(--rule); }
.icon-btn svg { width: 18px; height: 18px; }
.bar { position: relative; height: 8px; border-radius: 4px; background: rgba(0,0,0,.55); overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--hazard); border-radius: 4px; transition: width .15s linear; }
.btn-primary { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; padding: 0 28px; border-radius: 14px;
  background: var(--hazard); color: var(--ink); font-family: var(--f-display); font-size: 30px; letter-spacing: .08em;
  box-shadow: 0 5px 0 var(--hazard-deep), 0 12px 24px rgba(0,0,0,.45); transition: transform .08s, box-shadow .08s; }
.btn-primary:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--hazard-deep), 0 6px 12px rgba(0,0,0,.4); }
.btn-primary .num { font-size: 18px; letter-spacing: 0; opacity: .8; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: 12px;
  background: var(--panel-hi); border: 1px solid var(--rule); font-family: var(--f-display); font-size: 19px; letter-spacing: .05em; }
.btn:active { transform: translateY(1px); }
.buy { display: inline-flex; align-items: center; gap: 4px; min-width: 76px; height: 36px; padding: 0 10px; border-radius: 10px; justify-content: center;
  background: var(--hazard); color: var(--ink); font-family: var(--f-num); font-size: 13px; box-shadow: 0 3px 0 var(--hazard-deep); }
.buy img.ic { width: 16px; height: 16px; }
.buy:disabled { background: #3a424c; color: #7d8894; box-shadow: 0 3px 0 #2a3138; cursor: default; }
.buy.claim { background: var(--toxic); box-shadow: 0 3px 0 #5f8a2e; font-family: var(--f-display); font-size: 17px; }
.buy.done { background: transparent; box-shadow: none; color: var(--muted); font-family: var(--f-body); font-size: 12px; border: 1px dashed var(--rule); }
.dot { position: absolute; top: 4px; right: 18%; width: 8px; height: 8px; border-radius: 50%; background: var(--blood); box-shadow: 0 0 0 2px var(--asphalt); }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
.hud-top { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; align-items: center; gap: 8px; }
.hud-prog { flex: 1; min-width: 0; }
.hud-res { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.hud-res .res { height: 26px; font-size: 12px; }
.res.kills { color: #ffe9e6; transition: transform .12s; }
.res.kills.pop { transform: scale(1.25); }
.hud-prog-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.hud-prog-top b { font-family: var(--f-num); color: var(--text); font-weight: 400; font-size: 12px; }
.hud-prog .bar { height: 9px; }
.hud-prog .bar > i { background: linear-gradient(90deg, var(--hazard), #ffd36b); }
.hud-prog .bar.boss > i { background: linear-gradient(90deg, #b8302a, var(--blood)); }
.hud-energy { position: absolute; top: 52px; left: 10px; right: 96px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
.hud-energy span { font-family: var(--f-num); font-size: 11px; color: var(--ice); min-width: 34px; }
.hud-energy .bar { flex: 1; height: 5px; }
.hud-energy .bar > i { background: var(--ice); }
.loadout { position: absolute; top: 66px; left: 10px; display: flex; flex-wrap: wrap; gap: 4px; pointer-events: none; max-width: 70%; }
.lo { position: relative; width: 28px; height: 28px; border-radius: 7px; background: rgba(17,20,24,.75); border: 1px solid var(--rule); display: grid; place-items: center; }
.lo img { width: 20px; height: 20px; }
.lo b { position: absolute; right: -3px; bottom: -4px; font: 9px var(--f-num); background: #111418; border-radius: 4px; padding: 0 3px; color: var(--text); }
.lo.evo { border-color: var(--hazard); box-shadow: 0 0 0 1px var(--hazard) inset; }
.lo.evo b { background: var(--hazard); color: var(--ink); }
.lo.pas { border-radius: 50%; }

/* ---------- HOME ---------- */
#home { position: absolute; inset: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px 0; }
.topbar .spacer { flex: 1; }
#home.solid .topbar { background: rgba(28,33,39,.97); padding-bottom: 6px; }
.callout > img.ic { width: 34px; height: 34px; }
.view { position: relative; flex: 1; min-height: 0; }
.tab { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
#tab-battle { display: flex; flex-direction: column; align-items: stretch; justify-content: space-between; padding: 8px 16px 14px; overflow: hidden; }
.brand { text-align: center; margin-top: 4vh; }
.brand-cn { font-family: var(--f-display); font-size: clamp(44px, 14vw, 64px); line-height: 1; color: var(--hazard); letter-spacing: .06em;
  text-shadow: 0 3px 0 #6b4a08, 0 6px 18px rgba(0,0,0,.6); }
.brand-en { margin-top: 8px; font-family: var(--f-num); font-size: 12px; letter-spacing: .5em; color: var(--muted); padding-left: .5em; }
.brand-stripe { width: 150px; height: 8px; margin: 12px auto 0; border-radius: 2px; background: repeating-linear-gradient(135deg, var(--hazard) 0 8px, #1b1f24 8px 16px); }
.chapter { background: rgba(23,27,32,.88); border: 1px solid var(--rule); border-radius: 16px; padding: 14px 12px 12px; backdrop-filter: blur(4px); }
.ch-head { display: flex; align-items: center; gap: 8px; }
.ch-head .ch-title { flex: 1; text-align: center; }
.ch-no { font-size: 12px; color: var(--muted); letter-spacing: .2em; }
.ch-name { font-family: var(--f-display); font-size: 26px; letter-spacing: .08em; }
.ch-arrow { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--panel-hi); border: 1px solid var(--rule); font-family: var(--f-num); font-size: 18px; }
.ch-arrow:disabled { opacity: .3; }
.stages { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); align-items: start; margin: 14px 0 6px; }
.stages::before { content: ""; position: absolute; left: 10%; right: 10%; top: 21px; height: 4px; background: repeating-linear-gradient(90deg, var(--rule) 0 8px, transparent 8px 13px); }
.node { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.node button { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-hi); border: 2px solid var(--rule); font-family: var(--f-num); font-size: 14px; }
.node.boss button { width: 48px; height: 48px; margin-top: -3px; border-color: #7a2a24; background: #3a1f1f; }
.node.cleared button { border-color: var(--toxic); }
.node.sel button { border-color: var(--hazard); box-shadow: 0 0 0 4px rgba(242,182,50,.25); background: #3b3420; }
.node.locked button { opacity: .45; }
.node img.ic { width: 22px; height: 22px; }
.stars { display: flex; gap: 1px; height: 12px; }
.stars svg { width: 12px; height: 12px; }
.ch-tip { text-align: center; font-size: 12px; color: var(--muted); min-height: 18px; }
.ch-tip b { color: var(--hazard); font-weight: 700; }
.hz-tip { margin-top: 6px; font-size: 12px; color: #c4ccd4; }
.hz-tip span { display: inline-block; margin-right: 6px; padding: 1px 8px; border-radius: 9px; font-weight: 700; color: #14171a; background: var(--hz); }
.battle-bottom { display: flex; flex-direction: column; gap: 12px; }
.howto { display: flex; justify-content: center; gap: 14px; font-size: 12px; color: var(--muted); }
.howto span { display: inline-flex; align-items: center; gap: 4px; }
.howto i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

/* sheets */
.sheet { min-height: 100%; padding: 12px 16px 24px; background: rgba(28,33,39,.97); }
.sheet h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; letter-spacing: .08em; margin: 2px 0 2px; text-wrap: balance; }
.sheet .sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
.row { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.row:last-child { border-bottom: 0; }
.row .ico { width: 46px; height: 46px; border-radius: 12px; background: var(--panel-hi); display: grid; place-items: center; position: relative; }
.row .ico img { width: 32px; height: 32px; }
.row .ico.round { border-radius: 50%; }
.row .t { font-weight: 700; font-size: 15px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.row .t .lv { font-family: var(--f-num); font-weight: 400; font-size: 11px; color: var(--hazard); }
.row .d { color: var(--muted); font-size: 12px; margin-top: 2px; line-height: 1.45; }
.row .d em { font-style: normal; color: var(--toxic); }
.row .mini { margin-top: 6px; height: 5px; }
.row .mini > i { background: var(--toxic); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 4px; margin: 6px 0 10px; }
.seg button { height: 36px; border-radius: 9px; font-family: var(--f-display); font-size: 18px; color: var(--muted); position: relative; }
.seg button.on { background: var(--panel-hi); color: var(--text); }
.callout { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: linear-gradient(135deg, #3b3420, #2a2a22); border: 1px solid #5a4a1e; margin-bottom: 8px; }
.callout .grow { flex: 1; min-width: 0; }
.callout .t { font-family: var(--f-display); font-size: 19px; letter-spacing: .04em; }
.callout .d { font-size: 12px; color: var(--muted); }
.wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wcard { border: 1px solid var(--rule); background: var(--panel); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.wcard.locked { opacity: .55; }
.wcard .top { display: flex; align-items: center; gap: 10px; }
.wcard .top img { width: 38px; height: 38px; }
.wcard .nm { font-weight: 700; font-size: 15px; }
.wcard .starline { font-family: var(--f-num); font-size: 11px; color: var(--hazard); }
.wcard .meta { font-size: 11px; color: var(--muted); line-height: 1.5; }
.wcard .meta b { color: var(--text); font-weight: 500; }
.wcard .bpline { display: flex; align-items: center; gap: 6px; font-family: var(--f-num); font-size: 11px; }
.wcard .bpline .bar { flex: 1; height: 5px; }
.wcard .bpline .bar > i { background: #6fa0ff; }
.wcard .buy { width: 100%; }
.section-label { font-size: 11px; letter-spacing: .25em; color: var(--muted); margin: 16px 0 6px; }

/* tab bar */
.tabbar { display: grid; grid-template-columns: repeat(5, 1fr); background: #171b20; border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar button { position: relative; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 11px; }
.tabbar svg { width: 22px; height: 22px; }
.tabbar button.on { color: var(--hazard); }
.tabbar button.on::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; background: var(--hazard); border-radius: 0 0 3px 3px; }

/* ---------- modal ---------- */
#modal { position: absolute; inset: 0; background: rgba(10,12,15,.72); display: grid; place-items: center; padding: 16px; z-index: 20; }
.mcard { width: 100%; max-width: 340px; max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid var(--rule); border-radius: 18px; padding: 18px 16px 16px; box-shadow: 0 24px 60px rgba(0,0,0,.6); animation: pop .22s ease-out; }
.mcard h3 { margin: 0; text-align: center; font-family: var(--f-display); font-weight: 400; font-size: 30px; letter-spacing: .1em; text-wrap: balance; }
.mcard .msub { text-align: center; color: var(--muted); font-size: 12px; margin-top: 4px; }
.mcard.win h3 { color: var(--hazard); }
.mcard.lose h3 { color: var(--blood); }
.mcard .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.mcard .actions .btn-primary { min-height: 52px; font-size: 24px; }
.mcard .actions .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choices { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.choice { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; padding: 12px; border-radius: 14px; background: var(--panel-hi); border: 2px solid var(--rule); animation: rise .25s ease-out backwards; }
.choice:nth-child(2) { animation-delay: .05s; } .choice:nth-child(3) { animation-delay: .1s; } .choice:nth-child(4) { animation-delay: .15s; }
.choice:active { transform: scale(.98); }
.choice .ico { width: 52px; height: 52px; border-radius: 12px; background: #1b2026; display: grid; place-items: center; }
.choice .ico img { width: 38px; height: 38px; }
.choice .nm { font-weight: 900; font-size: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.choice .tag { font: 10px var(--f-num); padding: 2px 6px; border-radius: 6px; background: #1b2026; color: var(--ice); white-space: nowrap; }
.choice .ds { font-size: 12px; color: #c4ccd4; margin-top: 3px; line-height: 1.4; }
.choice .nt { font-size: 11px; color: var(--hazard); margin-top: 3px; }
.choice.k-evo { border-color: var(--hazard); background: linear-gradient(135deg, #4a3d16, #2f3a44); }
.choice.k-evo .tag { background: var(--hazard); color: var(--ink); }
.choice.k-passive .ico { border-radius: 50%; }
.choice.k-supply .tag { color: var(--toxic); }
.reroll { margin-top: 12px; width: 100%; }
.result-stars { display: flex; justify-content: center; gap: 6px; margin: 12px 0 4px; }
.result-stars svg { width: 40px; height: 40px; animation: pop .3s ease-out backwards; }
.result-stars svg:nth-child(2) { animation-delay: .12s; width: 48px; height: 48px; margin-top: -8px; }
.result-stars svg:nth-child(3) { animation-delay: .24s; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
.stats div { background: #1b2026; border-radius: 10px; padding: 8px 4px; text-align: center; }
.stats b { display: block; font: 16px var(--f-num); }
.stats span { font-size: 11px; color: var(--muted); }
.rewards { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
.rewards .res { background: #1b2026; }
.unlock-note { margin-top: 12px; padding: 10px; border-radius: 12px; background: #2a3a26; border: 1px solid #4f6a3a; display: flex; gap: 10px; align-items: center; font-size: 13px; }
.unlock-note img { width: 34px; height: 34px; }
.tut { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.tut .r { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 10px; align-items: center; font-size: 13px; line-height: 1.45; }
.tut .r .sw { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font: 13px var(--f-num); }
.tut b { color: var(--text); }
.tut .c { color: #c4ccd4; }

/* ---------- banner / toast ---------- */
#banner { position: absolute; left: 0; right: 0; top: 26%; text-align: center; pointer-events: none; z-index: 15; }
#banner .bt { display: inline-block; font-family: var(--f-display); font-size: 40px; letter-spacing: .12em; padding: 6px 26px; color: #fff;
  background: linear-gradient(90deg, transparent, rgba(226,72,63,.85) 18%, rgba(226,72,63,.85) 82%, transparent); text-shadow: 0 2px 0 rgba(0,0,0,.4); }
#banner .bs { margin-top: 6px; font-weight: 700; font-size: 14px; color: #fff; text-shadow: 0 1px 3px #000; }
#banner.k-win .bt, #banner.k-evo .bt { color: var(--ink); text-shadow: none; background: linear-gradient(90deg, transparent, rgba(242,182,50,.92) 18%, rgba(242,182,50,.92) 82%, transparent); }
#banner.k-ice .bt { background: linear-gradient(90deg, transparent, rgba(52,118,170,.94) 18%, rgba(52,118,170,.94) 82%, transparent); }
#banner.k-toxic .bt { color: #1a2408; text-shadow: none; background: linear-gradient(90deg, transparent, rgba(166,216,74,.92) 18%, rgba(166,216,74,.92) 82%, transparent); }
#banner.k-dark .bt { background: linear-gradient(90deg, transparent, rgba(90,50,140,.92) 18%, rgba(90,50,140,.92) 82%, transparent); }
#banner.k-fire .bt { background: linear-gradient(90deg, transparent, rgba(214,82,40,.92) 18%, rgba(214,82,40,.92) 82%, transparent); }
#banner.k-boss .bt { font-size: 46px; background: repeating-linear-gradient(135deg, rgba(160,30,26,.92) 0 14px, rgba(30,10,10,.92) 14px 28px); }
#banner.show { animation: banner 2.1s ease-out forwards; }
#toast { position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%); background: rgba(17,20,24,.95); border: 1px solid var(--rule); padding: 9px 16px; border-radius: 12px; font-size: 13px; z-index: 30; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
@keyframes banner { 0% { opacity: 0; transform: scale(1.5); } 12% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
@keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; } }
</style>

<div id="app">
  <div id="stage">
    <canvas id="cv" aria-label="战场"></canvas>

    <div id="hud" hidden>
      <div class="hud-top">
        <button class="icon-btn" id="btnPause" aria-label="暂停">
          <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="#eef1f3"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#eef1f3"/></svg>
        </button>
        <div class="hud-prog">
          <div class="hud-prog-top"><span id="hudChapter">废弃公路</span><b id="hudStage">1-1</b></div>
          <div class="bar" id="hudBar"><i id="hudProg"></i></div>
        </div>
        <div class="hud-res">
          <div class="res"><img class="ic" data-icon="gold" alt=""><span id="hudGold">0</span></div>
          <div class="res kills" id="hudKillsBox"><img class="ic" data-icon="skull" alt="击杀"><span id="hudKills">0</span></div>
        </div>
      </div>
      <div class="hud-energy"><span id="hudLv">Lv1</span><div class="bar"><i id="hudEnergy"></i></div></div>
      <div class="loadout" id="hudLoadout"></div>
    </div>

    <div id="home">

  spawnBoss() {
    const B = this.chapter.boss;
    this.bossSpawned = true; this.bossPhase = true;
    const hp = zBase(this.d) * B.hp * 1200;
    this.boss = {
      x: W / 2, y: -70, tx: W / 2, r: B.r * 1.25, hp, maxHp: hp, t: 0, B, dead: false, hitT: 0,
      baseY: 175, chargeT: 0, chargeOff: 0, shieldT: 0, frozenT: 0, teleT: 0, enraged: false,
      atk: { thr: 2.5, sum: 5, chg: B.chargeR || 0, shd: B.shieldR || 0, tel: B.teleR || 0, move: 2 },
    };
    this.emit('banner', { text: 'BOSS 来袭', sub: B.name, kind: 'boss' });
    this.emit('boss', this.boss);
    SFX.boss();
  }

  // ---------- squad fire ----------
  updateFire(dt) {
    if (this.count <= 0) return;
    const tm = this.timers;
    tm.fire -= dt;
    let loops = 0;
    while (tm.fire <= 0 && loops < 3) { tm.fire += 1 / (VOLLEYS * this.rateMult()); this.fireVolley(); loops++; }
    if (tm.fire < 0) tm.fire = 0;
  }
  fireVolley() {
    const pts = this.formationPts(), n = pts.length, rng = this.rng;
    const streams = Math.min(this.count, 22);
    const total = 12 / VOLLEYS * this.dmgMult() * this.count;
    this.fireFx = 0.07;
    const per = total / streams;
    const crit = this.critChance(), burn = (this.passives.burn || 0) * 0.08;
    const sx = this.squad.x, sy = this.squadY;
    // light aim assist: soldiers angle their shots at the closest zombies just left/right of the squad
    const reach = Math.max(this.fr + 32, 82), tg = [];
    for (const z of this.zombies) if (!z.dead && z.y > 30 && Math.abs(z.x - sx) < reach) tg.push(z);
    tg.sort((a, b) => b.y - a.y);
    const nt = Math.min(3, tg.length);
    for (let i = 0; i < streams; i++) {
      const pt = pts[Math.floor(rng() * n)];
      const isCrit = rng() < crit;
      const bx = sx + pt[0] + 3, by = sy + pt[1] - 10;
      let vx = 0, vy = -780;
      if (nt && i % 2 === 0) { const z = tg[i % nt], dx = z.x - bx, dy = z.y - by; if (dy < -8) { const L = Math.hypot(dx, dy); vx = dx / L * 780; vy = dy / L * 780; } }
      const lead = rng() * 0.8 / (VOLLEYS * this.rateMult()); // stagger shots so each soldier's fire reads as a continuous stream
      this.bullets.push({ x: bx + vx * lead, y: by + vy * lead, vx, vy, dmg: per * (isCrit ? 2 : 1), crit: isCrit, burn: rng() < burn, pierce: 0, life: 1.0, kind: 'r' });
    }
    SFX.shot();
  }

  // ---------- special weapons ----------
  frontZombie() {
    let best = null;
    for (const z of this.zombies) if (!z.dead && z.y > -10 && (!best || z.y > best.y)) best = z;
    return best;
  }
  nearestZombie(x, y, maxD = 1e9, exclude) {
    let best = null, bd = maxD * maxD;
    for (const z of this.zombies) {
      if (z.dead || z.y < -10 || (exclude && exclude.has(z.id))) continue;
      const dx = z.x - x, dy = z.y - y, dd = dx * dx + dy * dy;
      if (dd < bd) { bd = dd; best = z; }
    }
    return best;
  }
  densestZombie() {
    let best = null, bc = -1;
    const zs = this.zombies;
    for (let i = 0; i < zs.length; i++) {
      const a = zs[i]; if (a.dead || a.y < 0) continue;
      let c = 0;
      for (let j = 0; j < zs.length; j++) { const b = zs[j]; if (b.dead) continue; const dx = a.x - b.x, dy = a.y - b.y; if (dx * dx + dy * dy < 2500) c++; }
      c += a.y / 400;
      if (c > bc) { bc = c; best = a; }
    }
    return best;
  }
  pickTarget(front) {
    const z = front ? this.frontZombie() : this.nearestZombie(this.squad.x, this.squadY);
    const B = this.boss && !this.boss.dead && this.boss.y > 0 ? this.boss : null;
    if (B && (!z || (z.y < this.lineY - 220 && this.rng() < 0.6))) return B;
    return z;
  }
  updateWeapons(dt) {
    const cdm = this.cdMult();
    this.beams.length = 0;
    for (const id in this.weapons) {
      const w = this.weapons[id];
      w.cd -= dt;
      const sp = this.SP(id), lv = w.lv;
      if (id === 'rocket') {
        if (w.cd <= 0) {
          const tgt = this.pickTarget(true);
          if (tgt) {
            w.cd = (2.4 - 0.15 * (lv - 1)) * cdm;
            const n = w.evo ? 3 : (lv >= 5 ? 3 : lv >= 3 ? 2 : 1);
            const dmg = sp * 1.6 * (1 + 0.25 * (lv - 1)) * (lv >= 4 ? 1.2 : 1);
            for (let i = 0; i < n; i++) this.launchRocket(tgt, { kind: 'rocket', dmg, r: 34, cluster: w.evo, delay: i * 0.08, spread: (i - (n - 1) / 2) * 0.5 });
          } else w.cd = 0.3;
        }
      } else if (id === 'shotgun') {
        if (w.cd <= 0) {
          const tgt = this.nearestZombie(this.squad.x, this.squadY, 330);
          if (tgt || (this.boss && !this.boss.dead && this.boss.y > this.squadY - 340)) {
            w.cd = (1.0 - (lv >= 3 ? 0.12 : 0)) * cdm;
            const n = w.evo ? 12 : 4 + lv + (this.passives.coil ? 1 : 0);
            const dmg = sp * 0.45 * (1 + 0.2 * (lv - 1)) * (w.evo ? 1.3 : 1);
            const pierce = w.evo ? 2 : (lv >= 5 ? 1 : 0);
            const spread = 0.95;
            for (let i = 0; i < n; i++) {
              const a = -Math.PI / 2 + (i / (n - 1) - 0.5) * spread + (this.rng() - 0.5) * 0.06;
              const sp2 = 560 + this.rng() * 80;
              this.bullets.push({ x: this.squad.x, y: this.squadY - 16, vx: Math.cos(a) * sp2, vy: Math.sin(a) * sp2, dmg, crit: false, burn: w.evo || (this.rng() < (this.passives.burn || 0) * 0.08), pierce, life: 0.5, kind: 's' });
            }
            SFX.shot();
          } else w.cd = 0.2;
        }
      } else if (id === 'laser') {
        if (w.beamT > 0) {
          w.beamT -= dt;
          const width = 10 + 2 * lv + (lv >= 5 ? 4 : 0) + (w.evo ? 4 : 0);
          const dps = sp * 3.0 * (1 + 0.3 * (lv - 1)) * (lv >= 4 ? 1.25 : 1);
          const angs = w.evo ? [-0.26, 0, 0.26] : [0];
          for (const a of angs) {
            const bm = { ox: this.squad.x, oy: this.squadY - 22, dx: Math.sin(a), dy: -Math.cos(a), w: width, t: w.beamT, color: WEAPONS.laser.color };
            this.beams.push(bm);
            this.beamDamage(bm, dps * dt);
          }
        } else if (w.cd <= 0) {
          if (this.frontZombie() || (this.boss && !this.boss.dead)) {
            w.cd = (3.4 - 0.2 * (lv - 1) - (lv >= 5 ? 0.4 : 0)) * cdm;
            w.beamT = (0.7 + 0.1 * (lv - 1) + (lv >= 3 ? 0.2 : 0)) * (w.evo ? 1.7 : 1);
            SFX.laser();
          } else w.cd = 0.3;
        }
      } else if (id === 'frost') {
        if (w.cd <= 0) {
          if (w.evo) {
            const any = this.zombies.some(z => !z.dead && z.y > 0) || (this.boss && !this.boss.dead);
            if (any) {
              w.cd = 6 * cdm;
              const dmg = sp * 1.5;
              for (const z of this.zombies) if (!z.dead && z.y > -20) { z.frozenT = 2.2; this.damageZombie(z, dmg, 'blast'); }
              if (this.boss && !this.boss.dead) { this.boss.frozenT = 1.1; this.damageBoss(dmg * 3, 'blast'); }
              this.flash = 0.35; this.flashColor = '#7fd8ff';
              this.fx.push({ type: 'ring', x: this.squad.x, y: this.squadY, r: 0, max: 700, t: 0, life: 0.6, color: '#bfeaff' });
              SFX.freeze();
            } else w.cd = 0.3;
          } else {
            const tgt = this.densestZombie() || (this.boss && !this.boss.dead ? this.boss : null);
            if (tgt) {
              w.cd = (4.2 - 0.25 * (lv - 1) - (lv >= 4 ? 0.5 : 0)) * cdm;
              this.launchRocket(tgt, { kind: 'frost', dmg: sp * 0.8 * (lv >= 3 ? 1.4 : 1), r: 48 * (lv >= 3 ? 1.25 : 1), slowT: 2.5 + 0.3 * (lv - 1), slowF: lv >= 5 ? 0.35 : 0.55 });
            } else w.cd = 0.3;
          }
        }
      } else if (id === 'tesla') {
        if (w.cd <= 0) {
          const first = this.nearestZombie(this.squad.x, this.squadY, 460);
          const B = this.boss && !this.boss.dead ? this.boss : null;
          if (first || B) {
            w.cd = (1.7 - 0.08 * (lv - 1) - (lv >= 4 ? 0.2 : 0)) * cdm;
            const chains = (w.evo ? 10 : 3 + (lv >= 2 ? 1 : 0) + (lv >= 4 ? 1 : 0) + (lv >= 5 ? 1 : 0)) + (this.passives.coil || 0);
            const dmg = sp * 0.9 * (1 + 0.2 * (lv - 1)) * (lv >= 3 ? 1.2 : 1);
            const pts = [[this.squad.x, this.squadY - 24]];
            if (first) {
              const seen = new Set(); let cur = first;
              for (let k = 0; k < chains && cur; k++) {
                seen.add(cur.id); pts.push([cur.x, cur.y]); this.damageZombie(cur, dmg, 'shock');
                cur = this.nearestZombie(cur.x, cur.y, 100, seen);
              }
            } else { pts.push([B.x, B.y]); this.damageBoss(dmg * 2, 'shock'); }
            this.fx.push({ type: 'bolt', pts, t: 0, life: 0.22, color: '#d8c8ff', seed: this.rng() * 1000 });
            if (w.evo) {
              for (let k = 0; k < 4; k++) {
                const zs = this.zombies.filter(z => !z.dead && z.y > 0);
                const z = zs.length ? zs[Math.floor(this.rng() * zs.length)] : null;
                const tx = z ? z.x : (B ? B.x : null);
                if (tx == null) break;
                const ty = z ? z.y : B.y;
                this.fx.push({ type: 'bolt', pts: [[tx + (this.rng() - 0.5) * 40, -10], [tx, ty]], t: 0, life: 0.25, color: '#f1e8ff', seed: this.rng() * 1000 });
                this.explode(tx, ty, 26, dmg * 2, { color: '#b28cff', small: true });
              }
            }
            SFX.zap();
          } else w.cd = 0.25;
        }
      } else if (id === 'drone') {
        const want = w.evo ? 6 : (lv >= 5 ? 3 : lv >= 3 ? 2 : 1);
        while (w.drones.length < want) w.drones.push({ a: this.rng() * 6.28, cd: this.rng() * 0.4, x: this.squad.x, y: this.squadY - 40 });
        const rate = w.evo ? 0.62 : Math.max(0.22, 0.45 - 0.05 * (lv >= 2 ? 1 : 0) - 0.03 * (lv - 1));
        const dmg = sp * 0.35 * (1 + 0.15 * (lv - 1)) * (lv >= 4 ? 1.25 : 1);
        w.drones.forEach((dr, i) => {
          dr.a += dt * 1.7;
          const ang = dr.a + i * (Math.PI * 2 / w.drones.length);
          dr.x = this.squad.x + Math.cos(ang) * 50; dr.y = this.squadY - 46 + Math.sin(ang) * 14;
          dr.cd -= dt;
          if (dr.cd <= 0) {
            const tgt = this.nearestZombie(dr.x, dr.y, 420) || (this.boss && !this.boss.dead && this.boss.y > 0 ? this.boss : null);
            if (tgt) {
              dr.cd = rate;
              if (w.evo) this.launchRocket(tgt, { kind: 'mini', dmg: dmg * 2.2, r: 22, from: [dr.x, dr.y], spd: 420 });
              else {
                const dx = tgt.x - dr.x, dy = tgt.y - dr.y, L = Math.hypot(dx, dy) || 1;
                const isCrit = this.rng() < this.critChance();
                this.bullets.push({ x: dr.x, y: dr.y, vx: dx / L * 640, vy: dy / L * 640, dmg: dmg * (isCrit ? 2 : 1), crit: isCrit, burn: false, pierce: 0, life: 1, kind: 'd' });
              }
            } else dr.cd = 0.2;
          }
        });
      }
    }
  }
  launchRocket(tgt, o) {
    const from = o.from || [this.squad.x + (o.spread || 0) * 20, this.squadY - 24];
    const ang = -Math.PI / 2 + (o.spread || 0);
    const spd = o.spd || (o.kind === 'frost' ? 330 : 360);
    this.rockets.push({
      x: from[0], y: from[1], vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, spd,
      tgt, tx: tgt ? tgt.x : from[0], ty: tgt ? tgt.y : -50, kind: o.kind, dmg: o.dmg, r: o.r,
      cluster: !!o.cluster, slowT: o.slowT, slowF: o.slowF, delay: o.delay || 0, life: 3, trail: 0,
    });
  }
  updateRockets(dt) {
    const rs = this.rockets;
    for (let i = rs.length - 1; i >= 0; i--) {
      const r = rs[i];
      if (r.delay > 0) { r.delay -= dt; continue; }
      r.life -= dt;
      if (r.tgt && !r.tgt.dead) { r.tx = r.tgt.x; r.ty = r.tgt.y; }
      const dx = r.tx - r.x, dy = r.ty - r.y, L = Math.hypot(dx, dy) || 1;
      const turn = Math.min(1, dt * (r.kind === 'bomblet' ? 10 : 6));
      r.vx = lerp(r.vx, dx / L * r.spd, turn); r.vy = lerp(r.vy, dy / L * r.spd, turn);
      const V = Math.hypot(r.vx, r.vy) || 1; r.vx = r.vx / V * r.spd; r.vy = r.vy / V * r.spd;
      r.x += r.vx * dt; r.y += r.vy * dt;
      r.trail -= dt;
      if (r.trail <= 0 && this.parts.length < 360) {
        r.trail = 0.025;
        this.parts.push({ x: r.x, y: r.y, vx: (this.rng() - 0.5) * 20, vy: 20, life: 0.35, max: 0.35, size: r.kind === 'frost' ? 3 : 3.5, color: r.kind === 'frost' ? '#bfeaff' : 'rgba(200,200,200,0.6)', kind: 'smoke' });
      }
      if (L < 12 || r.life <= 0 || r.y < -60) {
        rs[i] = rs[rs.length - 1]; rs.pop();
        this.detonate(r);
      }
    }
  }
  detonate(r) {
    if (r.kind === 'frost') {
      const R = r.r * this.blastMult();
      for (const z of this.zombies) {
        if (z.dead) continue;
        const dx = z.x - r.x, dy = z.y - r.y;
        if (dx * dx + dy * dy < (R + z.r) * (R + z.r)) { z.slowT = r.slowT; z.slowF = r.slowF; this.damageZombie(z, r.dmg, 'blast'); }
      }
      if (this.boss && !this.boss.dead && Math.hypot(this.boss.x - r.x, this.boss.y - r.y) < R + this.boss.r) this.damageBoss(r.dmg, 'blast');
      this.fx.push({ type: 'boom', x: r.x, y: r.y, r: R, t: 0, life: 0.4, color: '#7fd8ff', core: '#e6f8ff' });
      this.burst(r.x, r.y, 10, '#d8f3ff', 120, 'shard');
      SFX.freeze();
      return;
    }
    const color = r.kind === 'mini' ? '#7fb85a' : '#e0783a';
    this.explode(r.x, r.y, r.r, r.dmg, { color, small: r.kind !== 'rocket' });
    if (r.cluster) {
      for (let k = 0; k < 5; k++) {
        const a = this.rng() * Math.PI * 2, d = 30 + this.rng() * 40;
        this.rockets.push({ x: r.x, y: r.y, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, spd: 200, tgt: null, tx: r.x + Math.cos(a) * d, ty: r.y + Math.sin(a) * d, kind: 'bomblet', dmg: r.dmg * 0.45, r: 22, cluster: false, delay: 0, life: 0.6, trail: 0 });
      }
    }
  }
  beamDamage(bm, dmg) {
    for (const z of this.zombies) {
      if (z.dead) continue;
      const vx = z.x - bm.ox, vy = z.y - bm.oy;
      const t = vx * bm.dx + vy * bm.dy; if (t < 0) continue;
      const perp = Math.abs(vx * bm.dy - vy * bm.dx);
      if (perp < bm.w / 2 + z.r) this.damageZombie(z, dmg, 'beam');
    }
    const B = this.boss;
    if (B && !B.dead) {
      const vx = B.x - bm.ox, vy = B.y - bm.oy, t = vx * bm.dx + vy * bm.dy;
      if (t > 0 && Math.abs(vx * bm.dy - vy * bm.dx) < bm.w / 2 + B.r) this.damageBoss(dmg, 'beam');
    }
    if (bm.dx === 0) for (const it of this.items) {
      if (it.dead || it.gone || it.type === 'gate') continue;
      if (Math.abs(it.x - bm.ox) < it.w / 2 + bm.w / 2 && it.y < bm.oy) { it.hitT = 0.05; it.hp -= dmg; if (it.hp <= 0) this.breakItem(it); }
    }
  }
  explode(x, y, r, dmg, o = {}) {
    const raw = o.enemy || o.raw;
    const R = r * (raw ? 1 : this.blastMult());
    const D = dmg * (raw ? 1 : 1 + 0.15 * (this.passives.blast || 0));
    for (const z of this.zombies) {
      if (z.dead) continue;
      const dx = z.x - x, dy = z.y - y;
      if (dx * dx + dy * dy < (R + z.r) * (R + z.r)) this.damageZombie(z, D, 'blast');
    }
    const B = this.boss;
    if (B && !B.dead && Math.hypot(B.x - x, B.y - y) < R + B.r) this.damageBoss(D, 'blast');
    this.fx.push({ type: 'boom', x, y, r: R, t: 0, life: o.small ? 0.28 : 0.4, color: o.color || '#e0783a', core: '#f6dca0' });
    this.burst(x, y, o.small ? 6 : 12, o.color || '#ffb35c', o.small ? 120 : 200, 'spark');
    if (!o.small) this.shake = Math.max(this.shake, 0.18);
    SFX.boom();
  }

  // ---------- bullets ----------
  updateBullets(dt) {
    const bs = this.bullets, grid = this.zgrid || (this.zgrid = Array.from({ length: 16 }, () => []));
    for (const g of grid) g.length = 0;
    for (const z of this.zombies) {
      if (z.dead) continue;
      const a = clamp(Math.floor((z.x - z.r - 3) / 24), 0, 15), b = clamp(Math.floor((z.x + z.r + 3) / 24), 0, 15);
      for (let k = a; k <= b; k++) grid[k].push(z);
    }
    for (let i = bs.length - 1; i >= 0; i--) {
      const b = bs[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.life <= 0 || b.y < -30 || b.x < -20 || b.x > W + 20 || b.y > this.H + 20 || this.collideBullet(b)) {
        bs[i] = bs[bs.length - 1]; bs.pop();
      }
    }
    if (bs.length > 420) bs.splice(0, bs.length - 420);
  }
  collideBullet(b) {
    for (const e of this.eproj) {
      if (e.dead) continue;
      if (Math.abs(e.x - b.x) < e.r + 3 && Math.abs(e.y - b.y) < e.r + 6) {
        e.hp -= b.dmg; if (e.hp <= 0) { e.dead = true; this.burst(e.x, e.y, 8, '#ffd27a', 120, 'spark'); }
        return true;
      }
    }
    for (const z of this.zgrid ? this.zgrid[clamp(Math.floor(b.x / 24), 0, 15)] : this.zombies) {
      if (z.dead) continue;
      const dx = z.x - b.x, dy = z.y - b.y, rr = z.r + 3;
      if (dx * dx + dy * dy < rr * rr) {
        if (b.hit && b.hit.indexOf(z.id) >= 0) continue;
        const need = z.hp / (z.shield ? 0.4 : 1);
        this.damageZombie(z, b.dmg, 'bullet');
        if (b.burn && !z.dead) { z.burnT = 3; z.burnDps = Math.max(z.burnDps, b.dmg * 0.6); }
        if (this.parts.length < 380) {
          if (this.rng() < 0.45) this.parts.push({ x: b.x, y: b.y + 2, vx: 0, vy: 0, life: 0.09, max: 0.09, size: b.crit ? 9 : 6, color: b.crit ? '#fff2a0' : '#ffb347', kind: 'flash' });
          if (this.rng() < 0.3) this.parts.push({ x: b.x, y: b.y + 4, vx: (this.rng() - 0.5) * 90, vy: -50 - this.rng() * 60, life: 0.25, max: 0.25, size: b.crit ? 3 : 2, color: b.crit ? '#ffe066' : '#ffd27a', kind: 'spark' });
        }
        if (b.pierce > 0) { b.pierce--; (b.hit || (b.hit = [])).push(z.id); continue; }
        // overkill carries on: a strong round punches through the rank behind
        if (z.dead && b.dmg > need * 1.05 && (b.pc || 0) < 6) { b.dmg -= need; b.pc = (b.pc || 0) + 1; (b.hit || (b.hit = [])).push(z.id); continue; }
        return true;
      }
    }
    const B = this.boss;
    if (B && !B.dead) {
      const dx = B.x - b.x, dy = B.y - b.y;
      if (dx * dx + dy * dy < B.r * B.r) { this.damageBoss(b.dmg, 'bullet'); if (this.rng() < 0.3) this.burst(b.x, b.y + 6, 1, '#ffe7a0', 80, 'spark'); return true; }
    }
    for (const it of this.items) {
      if (it.dead || it.gone) continue;
      if (Math.abs(b.x - it.x) < it.w / 2 && Math.abs(b.y - it.y) < it.h / 2) { this.hitItem(it, b.dmg); return true; }
    }
    return false;
  }

  // ---------- damage / kills ----------
  damageZombie(z, dmg, kind) {
    if (z.dead) return;
    if (z.shield && kind === 'bullet') dmg *= 0.4;
    z.hp -= dmg; z.hitT = 0.07;
    if (z.hp <= 0) this.killZombie(z);
    else if (z.ice && z.hp < z.maxHp * 0.62) { z.ice = 0; if (this.parts.length < 340) this.burst(z.x, z.y - z.r * 1.2, 7, '#d8f3ff', 130, 'shard'); }
  }
  killZombie(z) {

  damageBoss(dmg, kind) {

  killBoss() {
    const B = this.boss; B.dead = true; B.hp = 0; this.bossKilled = true;
    this.corpses.push({ type: 'boss', boss: B, x: B.x, y: B.y, r: B.r, t: 0, life: 2.2, dir: this.rng() < 0.5 ? -1 : 1 });

  gainEnergy(x) {

  }

  // ---------- zombies ----------
  updateZombies(dt) {
    const zs = this.zombies, chill = this.passives.chill || 0;
    const spMul = 1 + 0.25 * this.p, bs = this.blockSpeed();
    // the crowd runs in from the back and slows into a packed mass near the barricade
    const push = 1 + clamp((this.frontGap - 50) / 110, 0, 1) * 2.2 * clamp((this.t - 3) / 5, 0, 1);
    const hzm = this.hzSpeedMul();
    const vNear = 22 * (1 + 0.3 * this.p) * (1 + 0.04 * this.ch) * (this.surgeT > 0 ? 1.4 : 1) * push * hzm, vFar = Math.max(bs, vNear * 2.6);
    let front = -1e9, biters = 0;
    // close ranks: a block zombie with an empty gap in front of it hurries forward, so the crowd stays a solid wall
    const cols = new Map();
    for (const z of zs) if (!z.dead && z.block) { const k = Math.round((z.x - LANES[1][0]) / 16); let a = cols.get(k); if (!a) cols.set(k, a = []); a.push(z); }
    for (const a of cols.values()) {
      a.sort((p, q) => q.y - p.y);
      for (let i = 0; i < a.length; i++) a[i].gapAhead = i === 0 ? 1e9 : a[i - 1].y - a[i].y;
    }
    // spread sideways into thinned columns so the front stays a full-width wall
    const lineY = this.lineY, spaceAt = (k, y) => {
      const a = cols.get(k); if (!a) return lineY - y;
      let best = lineY - y;
      for (let i = a.length - 1; i >= 0; i--) { if (a[i].y > y + 1) { best = a[i].y - y; break; } }
      return best;
    };
    const kMax = Math.round((LANES[1][1] - LANES[1][0]) / 16);
    for (const [k, a] of cols) for (const z of a) {
      const own = Math.min(z.gapAhead, lineY - z.y);
      let dir = 0, bestS = own + 18;
      if (k > 0) { const sl = spaceAt(k - 1, z.y); if (sl > bestS) { bestS = sl; dir = -1; } }
      if (k < kMax) { const sr = spaceAt(k + 1, z.y); if (sr > bestS) { bestS = sr; dir = 1; } }
      z.drift = dir;
    }
    for (const z of zs) {
      if (z.dead) continue;
      if (z.hitT > 0) z.hitT -= dt;
      if (z.biteT > 0) z.biteT -= dt;
      if (z.slowT > 0) { z.slowT -= dt; if (z.slowT <= 0) z.slowF = 1; }
      if (z.burnT > 0) { z.burnT -= dt; this.damageZombie(z, z.burnDps * dt, 'burn'); if (z.dead) continue; if (this.rng() < dt * 8 && this.parts.length < 360) this.parts.push({ x: z.x + (this.rng() - 0.5) * z.r, y: z.y - z.r * 0.6, vx: 0, vy: -40, life: 0.35, max: 0.35, size: 3, color: '#ff8a3d', kind: 'spark' }); }
      let f = 1;
      if (z.frozenT > 0) { z.frozenT -= dt; f = 0; }
      else if (z.slowT > 0) f = z.slowF;
      if (chill && z.y > this.lineY - 150) f *= Math.max(0.3, 1 - 0.12 * chill);
      const stopY = this.lineY - z.r * 0.55;
      if (!z.atLine) {
        let v;
        if (z.block) { const k = clamp((this.lineY - z.y - 110) / 330, 0, 1); v = (vNear + (vFar - vNear) * k) * (z.gapAhead > ROW_GAP * 1.35 ? 1.6 : 1); }
        else v = z.spd * spMul * hzm;
        z.y += v * f * dt;
        if (!z.block) z.x += Math.sin(this.time * 2.2 + z.phase) * 9 * dt * f;
        else if (z.drift) z.x += z.drift * 46 * dt * f;
      }
      if (z.block && z.y > front) front = z.y;
      if (z.y >= stopY) {
        z.y = stopY; biters++;
        if (this.demo) { this.killZombie(z); continue; }
        if (!z.atLine) {
          z.atLine = true; z.atk = 0.7; this.leaked++;
          if (z.explode) {
            z.dead = true;
            this.bite(z, z.dmg * 2);
            this.fx.push({ type: 'boom', x: z.x, y: this.lineY, r: 50, t: 0, life: 0.4, color: '#8f9f44', core: '#fff1c2' });
            continue;
          }
        }
        if (f > 0) {
          z.atk -= dt;
          if (z.atk <= 0) { z.atk = BITE_EVERY * (0.9 + this.rng() * 0.2); this.bite(z, z.dmg); }
        }
      }
    }
    this.frontGap = front > -1e9 ? this.lineY - front : 999;
    let liveZ = 0; for (const z of zs) if (!z.dead) liveZ++; this.liveZ = liveZ;
    this.biters = biters;
    if (this.wallHitT > 0) this.wallHitT -= dt;
    if (!biters && this.wall < this.wallMax) { this.wall = Math.min(this.wallMax, this.wall + this.wallMax * 0.05 * dt); if (this.wall > this.wallMax * 0.3) this.wallBroken = false; }

        const b = zs[j]; if (b.dead) continue;
        const dx = b.x - a.x, dy = b.y - a.y, rr = (a.r + b.r) * 0.85;
        if (dx > rr || dx < -rr || dy > rr || dy < -rr) continue;
        const d2 = dx * dx + dy * dy;
        if (d2 < rr * rr && d2 > 0.01) {
          const d = Math.sqrt(d2), push = (rr - d) * 0.5;
          const nx = dx / d, ny = dy / d;
          const wa = a.atLine ? 0.2 : a.giant ? 0.3 : 1, wb = b.atLine ? 0.2 : b.giant ? 0.3 : 1;

          if (a.y < b.y) { if (!a.atLine) a.y -= ny * push * 0.6; } else if (!b.atLine) b.y -= ny * push * 0.6;
        }
      }
    }
    for (const z of zs) {
      if (z.dead) continue;
      const lane = z.lane, half = Math.max(0, laneHalf(lane) - z.r - 2);
      z.x = clamp(z.x, LANE_X[lane] - half, LANE_X[lane] + half);
    }
    if (zs.length > 40 || this.time % 1 < dt) this.zombies = zs.filter(z => !z.dead);
  }

  bite(z, dmg) {
    z.biteT = 0.25;
    if (this.wall > 0 && !this.wallBroken) {
      this.wall -= dmg; this.wallHitT = 0.15;
      this.burst(z.x, this.lineY, 3, '#c9a86a', 90, 'shard');
      this.shake = Math.max(this.shake, z.giant ? 0.25 : 0.06);

    this.flash = Math.max(this.flash, 0.14); this.flashColor = '#e2483f';

  // ---------- boss ----------
  updateBoss(dt) {

          const tx = this.squad.x + (k ? (this.rng() - 0.5) * 120 : 0), sy = B.y + B.r * 0.5;
          const ty = this.squadY, dx = tx - B.x, dy = ty - sy, L = Math.hypot(dx, dy) || 1, spd = 210 + this.ch * 10;
          this.eproj.push({ x: B.x, y: sy, vx: dx / L * spd, vy: dy / L * spd, r: 11, hp: zBase(this.d) * 12, kind: R.proj, rot: 0, dead: false });
        }
      }
    }
    if (R.summonR) {
      a.sum -= dt;

        B.x = B.tx = 60 + this.rng() * (W - 120);
        this.fx.push({ type: 'ring', x: B.x, y: B.y, r: 0, max: 80, t: 0, life: 0.35, color: R.skin });
      }

  updateEproj(dt) {

  // ---------- side items ----------
  updateItems(dt) {

      const it = its[i];
      if (it.dead) { its.splice(i, 1); continue; }
      it.y += this.scroll * dt;
      if (it.hitT > 0) it.hitT -= dt;
      if (it.bump > 0) it.bump -= dt;

      if (it.y + it.h / 2 >= this.lineY) {

        it.gone = true; it.fade = 0.5;

  }
  hitItem(it, dmg) {
    it.hitT = 0.07;
    if (it.type === 'gate') {
      if (it.op === 'add') {
        it.acc += dmg;
        const step = this.gateStep();
        if (it.val >= it.cap) { it.acc = 0; return; }
        if (it.acc >= step) { const k = Math.floor(it.acc / step); it.acc -= k * step; it.val = Math.min(it.cap, it.val + k); it.bump = 0.12; }
      } else if (it.op === 'div') {
        it.hp -= dmg;
        if (it.hp <= 0) { it.dead = true; this.burst(it.x, it.y, 16, '#ff6b7a', 160, 'shard'); this.texts.push({ x: it.x, y: it.y, text: '已摧毁', color: '#ffd0d5', life: 0.9, max: 0.9, size: 14 }); }
      }

    }

  }
  breakItem(it) {

      for (let k = 0; k < 10; k++) this.parts.push({ x: it.x + (this.rng() - 0.5) * 50, y: it.y + (this.rng() - 0.5) * 60, vx: 0, vy: 0, life: 0.6 + k * 0.05, max: 0.6 + k * 0.05, size: 1, color: '#6a7a48', kind: 'recruit' });
      this.texts.push({ x: it.x, y: it.y - 20, text: '黄金战士 +' + n + ' 兵', color: '#ffe08a', life: 1.5, max: 1.5, size: 20 });
      const wid = this.pickCrateWeapon(); if (wid !== 'supply') this.gainWeapon(wid, it.x, it.y + 30);

      this.texts.push({ x: it.x, y: it.y, text: '+' + fmt(g) + ' 金', color: '#ffd76a', life: 1.1, max: 1.1, size: 18 });

  }
  gainWeapon(id, x, y) {
    let text;
    const w = this.weapons[id];
    if (w) {
      if (w.lv < 5) { w.lv++; text = WEAPONS[id].name + ' Lv' + w.lv; }
      else { const n = Math.max(5, Math.round(this.count * 0.1)); this.addCount(n); text = '满级 · 补给 +' + n; }
    } else if (this.weaponCount() < 4) { this.weapons[id] = this.newWeapon(id, 1); text = '获得 ' + WEAPONS[id].name; }
    else { const n = Math.max(5, Math.round(this.count * 0.1)); this.addCount(n); text = '补给 +' + n; }
    this.texts.push({ x: x || W / 2, y: y || this.H / 2, text, color: '#ffc27a', life: 1.3, max: 1.3, size: 17 });
    this.emit('loadout');
  }
  applyGate(g) {
    const before = this.count;
    let good = true, label;
    if (g.op === 'add') {
      const v = g.val > 0 ? Math.round(g.val * this.recruitMult()) : g.val;
      this.addCount(v); good = g.val >= 0; label = (g.val >= 0 ? '+' : '') + v;
    } else if (g.op === 'mul') { this.setCount(this.count * g.val); label = '×' + g.val; }
    else { this.setCount(Math.floor(this.count / g.val)); good = false; label = '÷' + g.val; }
    if (good && this.count >= before) this.gatesGood++;
    this.fx.push({ type: 'gate', x: g.x, y: g.y, w: g.w, h: g.h, t: 0, life: 0.4, color: good ? '#3d8bff' : '#ff4d5e' });
    this.texts.push({ x: this.squad.x, y: this.squadY - 50, text: label, color: good ? '#8fc1ff' : '#ff8f9a', life: 1.1, max: 1.1, size: 24 });
    if (!good) { this.flash = 0.2; this.flashColor = '#ff4d5e'; }
    SFX.gate(good);
  }

  // ---------- passives over time ----------
  updatePassives(dt) {
    const m = this.passives.medic || 0;
    if (m && this.count > 0) {
      this.timers.medic += dt;
      const iv = 4.5 - 0.5 * m;
      if (this.timers.medic >= iv) { this.timers.medic -= iv; this.addCount(1 + Math.floor(m / 2) + Math.floor(this.count * 0.004 * m)); }
    }
  }

  // ---------- fx ----------
  burst(x, y, n, color, speed, kind) {
    if (this.parts.length > 340) n = Math.min(n, 3);
    for (let i = 0; i < n; i++) {
      const a = this.rng() * Math.PI * 2, s = speed * (0.3 + this.rng() * 0.7);
      const life = 0.3 + this.rng() * 0.35;
      this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (kind === 'goo' ? 30 : 0), life, max: life, size: kind === 'shard' ? 3 + this.rng() * 3 : 2 + this.rng() * 2, color, kind, rot: this.rng() * 6 });
    }
  }
  updateFx(dt) {
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 1.6);
    if (this.flash > 0) this.flash = Math.max(0, this.flash - dt * 1.4);
    const fx = this.fx;
    for (let i = fx.length - 1; i >= 0; i--) { const f = fx[i]; f.t += dt; if (f.t >= f.life) fx.splice(i, 1); }
    const ps = this.parts, sx = this.squad.x, sy = this.squadY;
    for (let i = ps.length - 1; i >= 0; i--) {
      const p = ps[i]; p.life -= dt;
      if (p.life <= 0) { ps[i] = ps[ps.length - 1]; ps.pop(); continue; }
      if (p.kind === 'recruit') { const k = Math.min(1, dt * 7); p.x += (sx - p.x) * k; p.y += (sy - p.y) * k; }
      else if (p.kind === 'coin') { const k = Math.min(1, dt * 4); p.x += (W - 30 - p.x) * k; p.y += (14 - p.y) * k; }
      else {
        p.x += p.vx * dt; p.y += p.vy * dt;
        const drag = p.kind === 'smoke' ? 0.9 : 0.94;
        p.vx *= Math.pow(drag, dt * 60); p.vy *= Math.pow(drag, dt * 60);
        if (p.kind === 'goo' || p.kind === 'shard') p.vy += 260 * dt;
      }
    }
    const cs = this.corpses;
    for (let i = cs.length - 1; i >= 0; i--) { const c = cs[i]; c.t += dt; c.y += this.scroll * dt * 0.6; if (c.t >= c.life) cs.splice(i, 1); }
    const ts = this.texts;
    for (let i = ts.length - 1; i >= 0; i--) { const t = ts[i]; t.life -= dt; t.y -= 30 * dt; if (t.life <= 0) ts.splice(i, 1); }
  }

  // ---------- end ----------
  checkEnd() {
    if (this.state !== 'play') return;
    if (this.count <= 0) {
      if (this.demo) { this.count = 26; return; }
      if (this.meta.revive && !this.revived) { this.state = 'revive'; this.emit('revive'); }
      else this.lose();
      return;
    }
    if (!this.isBoss && this.t >= this.T && !this.zombies.some(z => !z.dead)) {
      if (this.demo) { this.resetDemo(); return; }
      this.win();
    }
  }
  resetDemo() { this.t = 0; this.p = 0; this.events = {}; this.items.length = 0; }
  win() {
    if (this.state !== 'play') return;
    this.hz.active = 0; this.hz.list.length = 0;
    this.state = 'ending'; this.result = 'won'; this.endTimer = 1.5;
    this.emit('banner', { text: '防线守住了', sub: this.isBoss ? this.chapter.boss.name + ' 已被击败' : '关卡完成', kind: 'win' });
    SFX.win();
  }
  lose() {
    this.hz.active = 0; this.hz.list.length = 0;
    this.state = 'ending'; this.result = 'lost'; this.endTimer = 1.3;
    this.emit('banner', { text: '防线失守', sub: '强化后再来', kind: 'lose' });
    SFX.lose();
  }
  revive() {
    if (this.state !== 'revive') return;
    this.revived = true;
    this.setCount(Math.max(10, Math.round(this.maxCount * 0.4)));
    this.wall = this.wallMax; this.wallBroken = false;
    for (const z of this.zombies) if (!z.dead && z.y > this.lineY - 260) this.killZombie(z);
    this.eproj.length = 0;
    if (this.boss && !this.boss.dead) { this.boss.baseY = Math.max(140, this.boss.baseY - 140); this.boss.chargeT = 0; }
    this.fx.push({ type: 'ring', x: this.squad.x, y: this.squadY, r: 0, max: 520, t: 0, life: 0.6, color: '#f2b632' });
    this.state = 'play';
  }
  stars() { return this.result === 'won' ? (this.leaked <= 3 ? 3 : this.leaked <= 12 ? 2 : 1) : 0; }
  summary() {
    return {
      won: this.result === 'won', idx: this.idx, kills: this.kills, maxCount: this.maxCount, gold: Math.floor(this.gold),
      leaked: this.leaked, stars: this.stars(), ice: this.iceBroken, gatesGood: this.gatesGood, crates: this.crates,
      evolves: this.evolves, evolvedIds: this.evolvedIds.slice(), bossKilled: this.bossKilled, blueprints: Object.assign({}, this.blueprints),
      isBoss: this.isBoss, time: this.time,
    };
  }

  // ---------- level-up choices ----------
  makeChoices(n) {
    const pool = [], picks = [];
    for (const id in this.weapons) {
      const w = this.weapons[id];
      if (w.lv >= 5 && !w.evo && this.passives[WEAPONS[id].pair]) picks.push({ kind: 'evo', id });
    }
    for (const id in this.weapons) { const w = this.weapons[id]; if (w.lv < 5) pool.push({ kind: 'weapon', id, w: 10 }); }
    if (this.weaponCount() < 4) for (const id of this.meta.unlocked) if (!this.weapons[id]) pool.push({ kind: 'weapon', id, w: 7 });
    for (const id of PASSIVE_IDS) {
      const lv = this.passives[id] || 0;
      if (lv > 0 && lv < 5) pool.push({ kind: 'passive', id, w: 9 });
      else if (lv === 0 && this.passiveCount() < 4) {
        let wt = 6;
        const ev = PASSIVES[id].evoFor;
        if (ev && this.weapons[ev]) wt = 9;
        if (ev && !this.meta.unlocked.includes(ev)) wt = 3;
        pool.push({ kind: 'passive', id, w: wt });
      }
    }
    while (picks.length < n && pool.length) {
      let tot = 0; for (const c of pool) tot += c.w;
      let r = this.rng() * tot, k = 0;
      for (; k < pool.length; k++) { r -= pool[k].w; if (r <= 0) break; }
      k = Math.min(k, pool.length - 1);
      picks.push(pool[k]); pool.splice(k, 1);
    }
    const sup = [{ kind: 'supply', id: 'troops' }, { kind: 'supply', id: 'gold' }, { kind: 'supply', id: 'energy' }];
    while (picks.length < Math.min(n, 3)) picks.push(sup[picks.length % 3]);
    return picks.slice(0, Math.max(n, picks.filter(c => c.kind === 'evo').length));
  }
  applyChoice(c) {
    if (c.kind === 'weapon') {
      const w = this.weapons[c.id];
      if (w) w.lv = Math.min(5, w.lv + 1); else this.weapons[c.id] = this.newWeapon(c.id, 1);
    } else if (c.kind === 'passive') this.passives[c.id] = (this.passives[c.id] || 0) + 1;
    else if (c.kind === 'evo') {
      this.weapons[c.id].evo = true; this.evolves++; this.evolvedIds.push(c.id);
      this.emit('banner', { text: '武器进化', sub: WEAPONS[c.id].evo, kind: 'evo' });
      this.flash = 0.3; this.flashColor = '#f2b632';
    } else if (c.kind === 'supply') {
      if (c.id === 'troops') this.addCount(Math.max(6, Math.round(this.count * 0.2)));
      else if (c.id === 'gold') this.gold += 40 * this.d * this.meta.goldMult;
      else { this.energy += this.need * 0.6; }
    }
    this.pending = Math.max(0, this.pending - 1);
    this.formN = -1;
    if (this.state === 'choose') this.state = 'play';
    this.emit('loadout');
  }
  choiceInfo(c) {
    if (c.kind === 'weapon') {
      const w = this.weapons[c.id], W2 = WEAPONS[c.id];
      const next = w ? w.lv + 1 : 1;
      return { icon: c.id, name: W2.name, tag: w ? `Lv${w.lv} → Lv${next}` : '新武器', desc: W2.lv[next - 1], kind: 'weapon' };
    }
    if (c.kind === 'passive') {
      const lv = this.passives[c.id] || 0, P = PASSIVES[c.id];
      const evo = P.evoFor ? `进化 ${WEAPONS[P.evoFor].name} 需要` : '';
      return { icon: c.id, name: P.name, tag: lv ? `Lv${lv} → Lv${lv + 1}` : '新被动', desc: P.desc, note: evo, kind: 'passive' };
    }
    if (c.kind === 'evo') return { icon: c.id, name: WEAPONS[c.id].evo, tag: '进化', desc: WEAPONS[c.id].evoDesc, kind: 'evo' };
    const S = { troops: ['紧急增援', '兵力 +20%'], gold: ['军饷', '获得一笔金币'], energy: ['战术充能', '能量 +60%'] }[c.id];
    return { icon: c.id === 'troops' ? 'troops' : c.id === 'gold' ? 'gold' : 'energy', name: S[0], tag: '补给', desc: S[1], kind: 'supply' };
  }

  // ---------- autopilot (demo + testing) ----------
  autopilot() {
    const sq = this.squad;
    let target = LANE_X[1];
    if (this.boss && !this.boss.dead && this.boss.y > 0) {
      target = clamp(this.boss.x, 30, W - 30);
      for (const e of this.eproj) if (e.y > this.squadY - 170 && Math.abs(e.x - sq.x) < this.fr + 18) target = e.x < sq.x ? Math.min(W - 30, sq.x + 70) : Math.max(30, sq.x - 70);
      sq.tx = this.dodge(target); return;
    }
    const threat = this.frontGap < 35 || this.biters > 2;
    const sideBiter = this.zombies.find(z => !z.dead && z.lane !== 1 && z.atLine);
    if (sideBiter && !threat) { sq.tx = this.dodge(sideBiter.x); return; }
    let best = null, bs = 0;
    for (const it of this.items) {
      if (it.gone || it.dead || it.y < 30 || it.y > this.lineY - 30) continue;
      let s = 0;
      if (it.type === 'ice') s = 3; else if (it.type === 'crate') s = 4; else if (it.type === 'barrel') s = 1.5;
      else if (it.op === 'mul' || (it.op === 'add' && it.val > 0)) s = 5 + it.y / this.lineY * 3;
      else if (it.op === 'add') s = 2.5; else s = 1;
      if (s > bs) { bs = s; best = it; }
    }
    if (best && !threat) target = best.x;
    for (const it of this.items) {
      if (it.type !== 'gate' || it.gone || it.y < this.lineY - 110) continue;
      const bad = (it.op === 'add' && it.val < 0) || it.op === 'div';
      if (bad && Math.abs(sq.x - it.x) < 70) target = LANE_X[1];
      if (!bad && (!threat || it.op === 'mul')) target = it.x;
    }
    sq.tx = this.dodge(target);
  }
  // step out from under any meteor marked on the squad
  dodge(target) {
    const h = this.hz;
    if (h.kind !== 'meteor' || h.active <= 0) return target;
    for (const m of h.list) {
      if (!m.onSq || !m.shown || m.done) continue;
      const danger = m.r + this.fr * 0.5 + 14;
      if (Math.abs(target - m.x) < danger || Math.abs(this.squad.x - m.x) < danger) target = m.x < W / 2 ? Math.min(W - 24, m.x + danger + 10) : Math.max(24, m.x - danger - 10);
    }
    return target;
  }
}

// ================= RENDER (canvas) =================
const NUM_FONT = '"Bungee", "Noto Sans SC", system-ui, sans-serif';
const CN_FONT = '"ZCOOL QingKe HuangYou", "Noto Sans SC", "PingFang SC", sans-serif';

function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16), f = v => clamp(Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt), 0, 255);
  return '#' + ((1 << 24) | (f(n >> 16) << 16) | (f((n >> 8) & 255) << 8) | f(n & 255)).toString(16).slice(1);
}
function mixc(a, b, t) {
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16), f = sh => Math.round(((A >> sh) & 255) * (1 - t) + ((B >> sh) & 255) * t);
  return '#' + ((1 << 24) | (f(16) << 16) | (f(8) << 8) | f(0)).toString(16).slice(1);
}
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); }
function ell(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
function line(c, x1, y1, x2, y2) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }
function outlinedText(c, text, x, y, size, fill, stroke, font) {
  c.font = `${size}px ${font || NUM_FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineJoin = 'round'; c.lineWidth = Math.max(3, size * 0.22); c.strokeStyle = stroke || '#14171a';
  c.strokeText(text, x, y); c.fillStyle = fill; c.fillText(text, x, y);
}

// ---------- icons (24-unit grid) ----------
function drawIcon(c, id, x, y, s) {
  c.save(); c.translate(x - s / 2, y - s / 2); c.scale(s / 24, s / 24);
  c.lineCap = 'round'; c.lineJoin = 'round';
  const F = (col) => { c.fillStyle = col; c.fill(); };
  const S = (col, w) => { c.strokeStyle = col; c.lineWidth = w; c.stroke(); };
  switch (id) {
    case 'rocket':
      rr(c, 2, 10, 14, 5, 1); F('#6a7a48');
      c.beginPath(); c.moveTo(16, 8.5); c.lineTo(22.5, 12.5); c.lineTo(16, 16.5); c.closePath(); F('#ff8a3d');
      c.beginPath(); c.moveTo(2, 10); c.lineTo(0.5, 7); c.lineTo(6, 10); c.closePath(); F('#9aa63a');
      c.beginPath(); c.moveTo(2, 15); c.lineTo(0.5, 18); c.lineTo(6, 15); c.closePath(); F('#9aa63a');
      rr(c, 8, 15, 3, 5, 1); F('#2b2f33'); break;
    case 'shotgun':
      rr(c, 1.5, 8.5, 16, 3, 1); F('#4a5058'); rr(c, 1.5, 12, 13, 2.2, 1); F('#3a3f45');
      c.beginPath(); c.moveTo(16, 8.5); c.lineTo(22.5, 10); c.lineTo(22.5, 16); c.lineTo(16, 14.5); c.closePath(); F('#8a5a2e');
      rr(c, 5, 14, 6, 3.5, 1); F('#a06a36'); break;
    case 'laser':
      rr(c, 1.5, 7.5, 10, 9, 2); F('#5a6470'); circ(c, 12, 12, 3.2); F('#ff4d7a');
      rr(c, 14, 10.4, 9, 3.2, 1.5); c.globalAlpha = 0.85; F('#ff8fae'); c.globalAlpha = 1;
      rr(c, 3.5, 16, 4, 4, 1); F('#3a3f45'); break;
    case 'frost':
      for (let k = 0; k < 3; k++) {
        c.save(); c.translate(12, 12); c.rotate(k * Math.PI / 3);
        line(c, 0, -9.5, 0, 9.5); S('#7fd8ff', 2.4);
        c.beginPath(); c.moveTo(-3, -7.5); c.lineTo(0, -5); c.lineTo(3, -7.5); c.moveTo(-3, 7.5); c.lineTo(0, 5); c.lineTo(3, 7.5); S('#bfeaff', 1.6);
        c.restore();

    case 'drone':
      line(c, 6, 7, 18, 17); S('#3a3f45', 2); line(c, 18, 7, 6, 17); S('#3a3f45', 2);
      for (const [a, b] of [[5.5, 6.5], [18.5, 6.5], [5.5, 17.5], [18.5, 17.5]]) { circ(c, a, b, 3.6); S('#9fe870', 1.6); }
      rr(c, 8.5, 9.5, 7, 5, 1.5); F('#4a5058'); circ(c, 12, 12, 1.4); F('#9fe870'); break;
    case 'rifle':
      rr(c, 1, 10, 17, 3, 1); F('#4a5058'); rr(c, 14, 9, 9, 6, 1.5); F('#6a4a2e'); rr(c, 8, 13, 3, 6, 1); F('#2b2f33'); break;
    case 'ap':
      rr(c, 3, 8.5, 11, 7, 1.5); F('#d9a441');
      c.beginPath(); c.moveTo(14, 8.5); c.quadraticCurveTo(22, 12, 14, 15.5); c.closePath(); F('#c3ccd4');
      line(c, 3, 10.5, 3, 13.5); S('#9a7128', 2); break;
    case 'trigger': case 'rate':
      circ(c, 12, 12, 8); S('#f2b632', 2.2); line(c, 12, 1.5, 12, 6.5); S('#f2b632', 2.2); line(c, 12, 17.5, 12, 22.5); S('#f2b632', 2.2);
      line(c, 1.5, 12, 6.5, 12); S('#f2b632', 2.2); line(c, 17.5, 12, 22.5, 12); S('#f2b632', 2.2); circ(c, 12, 12, 2); F('#ff6b5e'); break;
    case 'blast':
      circ(c, 11, 14, 7.5); F('#3a3f45'); circ(c, 8.5, 11.5, 2); F('#5a6470');
      c.beginPath(); c.moveTo(15, 8); c.quadraticCurveTo(18, 4, 20, 5); S('#a08a5a', 1.6);
      circ(c, 20.5, 4.5, 2.4); F('#ff8a3d'); circ(c, 20.5, 4.5, 1.1); F('#fff1c2'); break;
    case 'burn':
      c.beginPath(); c.moveTo(12, 2); c.bezierCurveTo(19, 9, 20, 13, 18, 17); c.bezierCurveTo(16, 21.5, 8, 21.5, 6, 17); c.bezierCurveTo(4, 13, 7, 10, 9, 8); c.bezierCurveTo(9, 11, 11, 12, 12, 11); c.bezierCurveTo(13, 8, 12, 5, 12, 2); F('#ff8a3d');
      c.beginPath(); c.moveTo(12, 11); c.bezierCurveTo(16, 14, 15.5, 19, 12, 19.5); c.bezierCurveTo(8.5, 19, 9, 15, 12, 11); F('#f2d232'); break;
    case 'core':
      c.beginPath(); c.moveTo(12, 2); c.lineTo(20, 12); c.lineTo(12, 22); c.lineTo(4, 12); c.closePath(); F('#ff4d7a');
      c.beginPath(); c.moveTo(12, 6.5); c.lineTo(16.5, 12); c.lineTo(12, 17.5); c.lineTo(7.5, 12); c.closePath(); F('#ffc2d2'); break;
    case 'chill':
      c.beginPath(); c.moveTo(12, 2); c.lineTo(20, 5); c.lineTo(19, 13); c.quadraticCurveTo(17, 19, 12, 22); c.quadraticCurveTo(7, 19, 5, 13); c.lineTo(4, 5); c.closePath(); F('#3f7fa8');
      for (let k = 0; k < 3; k++) { c.save(); c.translate(12, 12); c.rotate(k * Math.PI / 3); line(c, 0, -5, 0, 5); S('#e6f8ff', 1.6); c.restore(); } break;
    case 'coil':
      c.beginPath(); c.moveTo(6, 4); c.lineTo(6, 13); c.arc(12, 13, 6, Math.PI, 0, true); c.lineTo(18, 4); S('#e2483f', 4);
      line(c, 6, 4, 6, 6.5); S('#d0d6dc', 4.2); line(c, 18, 4, 18, 6.5); S('#d0d6dc', 4.2);
      c.beginPath(); c.moveTo(13, 7); c.lineTo(10.5, 12); c.lineTo(13.5, 12); c.lineTo(11, 17); S('#f2d232', 1.6); break;
    case 'chip':
      for (let k = 0; k < 4; k++) { const v = 7.5 + k * 3; line(c, v, 2, v, 22); S('#b0b8c0', 1.4); line(c, 2, v, 22, v); S('#b0b8c0', 1.4); }
      rr(c, 5, 5, 14, 14, 2); F('#3a3f45'); rr(c, 8.5, 8.5, 7, 7, 1); F('#9fe870'); break;
    case 'recruit':
      line(c, 6, 3, 6, 22); S('#c3ccd4', 2);
      c.beginPath(); c.moveTo(7, 4); c.lineTo(20, 6.5); c.lineTo(7, 12); c.closePath(); F('#e2483f');
      circ(c, 11.5, 7.6, 1.6); F('#f2d232'); break;
    case 'medic':

  // ---------- 4 · 军事基地: desert outpost ----------
  bgBase(c, H, rng) {

  mesa(c, x, base, w, h) {

  hangar(c, x, by, s) {

  // ---------- 5 · 地下研究所: a lit tunnel deep underground ----------

      c.fillStyle = '#0c1419'; c.fillRect(-10, y, W + 20, 4.5);
      c.fillStyle = 'rgba(95,216,240,0.16)'; c.fillRect(-10, y + 4.5, W + 20, 3);

      for (let y = 0; y <= H; y += 20) { const e = Math.max(-20, this.edgeAt(y)); c.lineTo(side < 0 ? e : W - e, y); }

    for (let y = 30; y < H; y += 46) { line(c, -10, y, 140, y); line(c, W - 140, y, W + 10, y); }

    c.fillStyle = 'rgba(255,255,255,0.5)'; for (let k = 0; k < 4; k++) { circ(c, x - w * 0.25 + rng() * w * 0.5, by - h * (0.2 + rng() * 0.7), (0.6 + rng()) * s); c.fill(); }
    c.fillStyle = 'rgba(255,255,255,0.22)'; c.fillRect(x - w * 0.36, by - h + 2 * s, 2 * s, h - 10 * s);
    c.fillStyle = '#3a454e'; c.fillRect(x - w / 2 - 2 * s, by - h - 5 * s, w + 4 * s, 6 * s);

  console(c, x, by, s, rng) {

  // ---------- 6 · 末日之城: blood sky, burning towers ----------

    } else if (ch === 4) {
      this.wquad(c, LANES[0][0], far, LANES[0][1], near, 'rgba(255,255,255,0.025)'); this.wquad(c, LANES[2][0], far, LANES[2][1], near, 'rgba(255,255,255,0.025)');

  // ---------- decals that scroll with the road ----------
  decalsFor(ch) {

    const rng = mulberry32(500 + ch), out = [];
    const kinds = [['oil', 'crack', 'crack', 'dot'], ['ice', 'snow', 'crack', 'snow'], ['puddle', 'stain', 'crack', 'dot'], ['sand', 'tire', 'crack', 'sand'], ['grate', 'stripe', 'glow', 'grate'], ['lava', 'scorch', 'rubble', 'crack']][ch] || ['crack'];

  decal(c, d, x, y, s, t) {

      }

      case 'snow': c.fillStyle = 'rgba(236,244,250,0.55)'; ell(c, x, y, r * 1.2, r * 0.42); c.fill(); ell(c, x + r * 0.8, y + r * 0.1, r * 0.6, r * 0.25); c.fill(); break;
      case 'puddle': c.fillStyle = 'rgba(140,210,60,0.22)'; ell(c, x, y, r * 1.5, r * 0.5); c.fill(); c.fillStyle = 'rgba(200,250,120,0.28)'; ell(c, x - r * 0.3, y - r * 0.08, r * 0.5, r * 0.12); c.fill(); break;
      case 'stain': c.fillStyle = 'rgba(160,150,40,0.16)'; ell(c, x, y, r * 1.2, r * 0.45); c.fill(); break;
      case 'sand': c.fillStyle = 'rgba(214,180,120,0.22)'; ell(c, x, y, r * 1.8, r * 0.5); c.fill(); break;
      case 'tire': c.strokeStyle = 'rgba(0,0,0,0.16)'; c.lineWidth = 2.2 * s; line(c, x - 6 * s, y - 12 * s, x - 6 * s, y + 12 * s); line(c, x + 6 * s, y - 12 * s, x + 6 * s, y + 12 * s); break;

      case 'stripe': for (let k = 0; k < 4; k++) { c.fillStyle = k % 2 ? 'rgba(20,20,20,0.35)' : 'rgba(230,180,40,0.3)'; c.fillRect(x - r + k * r * 0.5, y - 2 * s, r * 0.5, 4 * s); } break;
      case 'glow': c.fillStyle = `rgba(95,216,240,${(0.08 + 0.05 * Math.sin(t * 3 + d.a * 6)).toFixed(3)})`; ell(c, x, y, r * 1.4, r * 0.4); c.fill(); break;

      case 'rubble': c.fillStyle = 'rgba(120,110,108,0.5)'; for (let k = 0; k < 3; k++) { poly(c, [x + k * 4 * s, y, x + k * 4 * s + 3 * s, y - 2.5 * s, x + k * 4 * s + 5 * s, y + 0.5 * s]); c.fill(); } break;
    }
  },

  // ---------- roadside props riding the guard rails ----------
  railSlots(run, H, fn) {
    const tot = run.time * run.scroll, base = Math.floor(tot / 70), off = tot - base * 70, far = this.pv.FAR, near = H + 90;
    for (let j = 0; ; j++) { const y = far - 70 + off + j * 70; if (y > near) break; fn(j - base, y); }
  },
  propsGround(c, run, H) {
